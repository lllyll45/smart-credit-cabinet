
services:
  db:
    image: postgres:16-alpine
    container_name: smart_credit_db
    environment:
      POSTGRES_USER: smart_credit
      POSTGRES_PASSWORD: smart_credit_dev_password
      POSTGRES_DB: smart_credit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_credit -d smart_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_credit_backend
    environment:
      APP_NAME: Smart Credit Cabinet
      APP_ENV: docker
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://smart_credit:smart_credit_dev_password@db:5432/smart_credit
      JWT_SECRET_KEY: CHANGE_ME_generate_with_python_secrets_token_urlsafe_48
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m scripts.seed_products &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: